<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>about:blank</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 20%, #f5f7fb, #e3e8ff 40%, #d3d8ff 70%, #f8f9ff 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #1c1f33;
      --accent: #5a6dff;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(900px, 100%);
      background: var(--card-bg);
      border-radius: 18px;
      padding: 28px 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      text-align: center;
      border: 1px solid rgba(90, 109, 255, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 36px);
      letter-spacing: -0.02em;
    }

    .tagline {
      margin: 0 0 20px;
      font-size: 16px;
      color: #4a5070;
    }

    .status-wrapper {
      background: #f5f7ff;
      border: 1px solid rgba(90, 109, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    iframe {
      width: 100%;
      height: 420px;
      border: none;
      border-radius: 10px;
    }

    .note {
      margin: 16px auto 0;
      color: #61688f;
      font-size: 14px;
      max-width: 640px;
      line-height: 1.6;
    }

    .logo {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      height: 48px;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.18));
      transition: transform 0.2s ease, filter 0.2s ease;
      user-select: none;
    }

    .logo:hover {
      transform: translateX(-50%) translateY(-2px) scale(1.02);
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.22));
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <h1 id="title">about:blank</h1>
    <p class="tagline">这里曾经有个页面，但它正在休假或者被关小黑屋了。</p>

    <div class="status-wrapper" aria-label="服务状态面板">
      <iframe src="https://main.kangqiovo.com/status/kangqistart" title="服务状态"></iframe>
    </div>

    <p class="note">别紧张，服务器还在努力工作。等它睡醒或者修好 bug，我们就把正片放回来了。收藏此页或刷新看看最新状态吧。</p>
  </main>

  <img class="logo" src="icon.png" alt="About Blank Logo" loading="lazy">
</body>
</html>
